<style>
:root{--navy:#0D3B66;--navy2:#092A4D;--gold:#E0A646;--gold2:#C8973C;--cream:#FAF5E9;--ink:#1b2733;--mut:#5f6f80;--line:#e3dccb}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream)}
header{height:56px;background:linear-gradient(90deg,var(--navy2),var(--navy));color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:3px solid var(--gold)}
header h1{font:800 17px 'Plus Jakarta Sans',sans-serif;margin:0;letter-spacing:.2px}
header small{opacity:.75;font-size:12px}
header .sp{flex:1}
#toggle{display:none;background:var(--gold);color:var(--navy2);border:0;border-radius:8px;padding:8px 12px;font:700 13px Inter;cursor:pointer}
#app{display:flex;height:calc(100% - 59px)}
aside{width:340px;max-width:100%;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:500}
.filters{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
#q{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:14px Inter;background:var(--cream)}
#q:focus,.chip:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;font:600 12px Inter;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.lbl{font:700 11px Inter;color:var(--mut);margin-bottom:4px}
.tg{display:flex;gap:16px;padding:8px 12px;border-bottom:1px solid var(--line);font:600 12.5px Inter}.tg label{display:flex;gap:6px;align-items:center;cursor:pointer}
#count{font:600 12px Inter;color:var(--mut);padding:8px 12px;border-bottom:1px solid var(--line)}
#list{overflow:auto;flex:1}
.item{padding:10px 12px;border-bottom:1px solid #f0ead9;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:hover,.item.sel{background:var(--cream)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.item b{font:700 13.5px Inter;display:block}
.item span{font-size:12px;color:var(--mut)}
#map{flex:1;position:relative}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font:800 11px Inter}
.pin.ap{opacity:.8}
.leaflet-popup-content{margin:0;width:290px!important;font-family:Inter,sans-serif}
.leaflet-popup-content-wrapper{padding:0;border-radius:12px;overflow:hidden}
.ph{height:110px;background:linear-gradient(135deg,var(--navy2),var(--navy));display:flex;align-items:center;justify-content:center;color:#fff;background-size:cover;background-position:center}
.ph.has{color:transparent}
.ph.lg{background:#fff}.ph.lg img{max-width:70%;max-height:70px;object-fit:contain}
.ph .ini{font:800 34px 'Plus Jakarta Sans'}
.pb{padding:12px 14px 14px}
.pb .dv{font:700 11px Inter;display:inline-block;padding:2px 8px;border-radius:999px;color:#fff;margin-bottom:6px}
.pb h3{margin:0 0 2px;font:800 15px 'Plus Jakarta Sans'}
.pb p{margin:2px 0;font-size:12.5px;color:var(--mut)}
.pb .ap{font-size:11.5px;color:#a56a00;background:#fff4dc;padding:4px 8px;border-radius:6px;margin-top:6px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.btns a{text-align:center;text-decoration:none;font:700 12px Inter;padding:9px 6px;border-radius:8px;border:1px solid var(--navy);color:var(--navy);background:#fff}
.btns a.pri{background:linear-gradient(135deg,var(--gold),var(--gold2));border-color:var(--gold2);color:var(--navy2)}
.btns a.full{grid-column:1/3}
.leaflet-control-attribution{font-size:9px;opacity:.6}
#dump{display:none;position:fixed;inset:70px 16px auto auto;width:360px;max-width:92vw;background:#fff;border:2px solid var(--gold);border-radius:10px;padding:10px;z-index:1200;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#dump textarea{width:100%;height:160px;font:11px monospace}
@media(max-width:760px){
 #toggle{display:block}
 aside{position:absolute;left:0;right:0;top:59px;bottom:0;width:100%;transform:translateX(-100%);transition:transform .2s}
 aside.open{transform:none}
 #app{position:relative}
}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>

var zL=[],mL=[];
function camadas(){
  zL.forEach(function(l){map.removeLayer(l);});mL.forEach(function(l){map.removeLayer(l);});zL=[];mL=[];
  if(document.getElementById('tgZ').checked) ZONAS.forEach(function(z){var p=L.polygon(z.coords,{color:z.color,weight:2,fillColor:z.color,fillOpacity:.25,opacity:.9}).bindTooltip(z.name,{sticky:true}).addTo(map);zL.push(p);});
  if(document.getElementById('tgM').checked) METRO.forEach(function(m){var p=L.polyline(m.coords,{color:m.color,weight:3,opacity:.85}).bindTooltip(m.name,{sticky:true}).addTo(map);mL.push(p);});
}
document.getElementById('tgZ').addEventListener('change',camadas);document.getElementById('tgM').addEventListener('change',camadas);
camadas();
var selDev=null, selZone=null, texto='', markers={}, cache={};
try{ cache=JSON.parse(localStorage.getItem('smq_stands_geo')||'{}'); }catch(e){}
function chave(s){return s.end+'|'+s.bairro;}
function aplicaCache(){STANDS.forEach(function(s){var c=cache[chave(s)];if(c&&!s.fixed){s.lat=c[0];s.lng=c[1];s.exato=true;}});}
aplicaCache();

function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
// Logos por construtora (link da imagem OU arquivo na hospedagem, ex.: 'logos/cury.png'). Sem logo = iniciais.
var LOGOS = {
 "Vitta Residencial":"https://vittaresidencial.com.br/images/logos/logo-vitta.png",
 "Emccamp":"https://emccamp.com.br/wp-content/themes/emccamp-site-institucional/images/logo-emccamp.svg",
 "Direcional Engenharia":"https://www.direcional.com.br/wp-content/uploads/2021/04/cropped-Group-1750-270x270.png"
};
var EXTRA=['#7f8c8d','#b8860b','#2e86c1','#6c3483','#117a65','#a04000'];
function cor(d){if(!CORES[d]){CORES[d]=EXTRA[Object.keys(CORES).length%EXTRA.length];}return CORES[d];}
function ini(d){return d.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();}
function enderecoCompleto(s){return s.end+', '+s.bairro+', São Paulo, SP';}
function qGoogle(s){return encodeURIComponent(s.dev+' stand de vendas '+enderecoCompleto(s));}
function linkFotos(s){return 'https://www.google.com/maps/search/?api=1&query='+qGoogle(s);}
function linkRota(s){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(enderecoCompleto(s));}
function linkStreet(s){return 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+s.lat+','+s.lng;}

function icon(s){
  return L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28],
   html:'<div class="pin'+(s.exato?'':' ap')+'" style="background:'+cor(s.dev)+'"><span>'+esc(ini(s.dev))+'</span></div>'});
}
function popup(s){
  var ph = s.foto ? '<div class="ph has" style="background-image:url(\''+esc(s.foto)+'\')"></div>'
                  : LOGOS[s.dev] ? '<div class="ph lg" style="border-bottom:4px solid '+cor(s.dev)+'"><img src="'+esc(LOGOS[s.dev])+'" alt="'+esc(s.dev)+'" referrerpolicy="no-referrer" onerror="this.parentNode.className=\'ph\';this.parentNode.style.background=\'linear-gradient(135deg,#092A4D,'+cor(s.dev)+')\';this.outerHTML=\'<span class=ini>'+esc(ini(s.dev))+'</span>\'"></div>'
                  : '<div class="ph" style="background:linear-gradient(135deg,#092A4D,'+cor(s.dev)+')"><span class="ini">'+esc(ini(s.dev))+'</span></div>';
  return ph+'<div class="pb"><span class="dv" style="background:'+cor(s.dev)+'">'+esc(s.dev)+'</span>'
   +'<h3>'+esc(s.nome)+'</h3><p>'+esc(s.end)+'</p><p>'+esc(s.bairro)+' · '+esc(s.zona)+'</p>'
   +(s.obs?'<p style="color:#0D3B66;font-weight:600">'+esc(s.obs)+'</p>':'')
   +(s.exato?'':'<div class="ap">Posição aproximada no mapa. Use “Como chegar” para o ponto exato.</div>')
   +'<div class="btns"><a class="pri" href="'+linkRota(s)+'" target="_blank" rel="noopener">Como chegar</a>'
   +'<a href="'+linkFotos(s)+'" target="_blank" rel="noopener">Fotos no Google</a>'
   +'<a class="full" href="'+linkStreet(s)+'" target="_blank" rel="noopener">Ver a rua no Street View</a></div></div>';
}
function visivel(s){
  if(selDev&&s.dev!==selDev) return false;
  if(selZone&&s.zona!==selZone) return false;
  if(texto){var t=(s.dev+' '+s.nome+' '+s.end+' '+s.bairro+' '+s.zona).toLowerCase(); if(t.indexOf(texto)<0) return false;}
  return true;
}
function renderChips(){
  var devs=[...new Set(STANDS.map(function(s){return s.dev;}))];
  var h='<button class="chip'+(selDev?'':' on')+'" data-d="">Todas</button>'+devs.map(function(d){
    var n=STANDS.filter(function(s){return s.dev===d;}).length;
    return '<button class="chip'+(selDev===d?' on':'')+'" data-d="'+esc(d)+'"><i style="background:'+cor(d)+'"></i>'+esc(d)+' ('+n+')</button>';}).join('');
  document.getElementById('devChips').innerHTML=h;
  var zs=ORDEM_ZONAS.filter(function(z){return STANDS.some(function(s){return s.zona===z;});}).concat([...new Set(STANDS.map(function(s){return s.zona;}))].filter(function(z){return z&&ORDEM_ZONAS.indexOf(z)<0;}));
  document.getElementById('zoneChips').innerHTML='<button class="chip'+(selZone?'':' on')+'" data-z="">Todas</button>'+zs.map(function(z){
    return '<button class="chip'+(selZone===z?' on':'')+'" data-z="'+esc(z)+'">'+esc(z)+'</button>';}).join('');
}
function render(fit){
  renderChips();
  var vis=STANDS.filter(visivel), grp=[];
  var semPos=vis.filter(function(s){return s.lat==null;}).length;
  Object.keys(markers).forEach(function(k){map.removeLayer(markers[k]);delete markers[k];});
  vis.forEach(function(s){
    if(s.lat==null) return;
    var m=L.marker([s.lat,s.lng],{icon:icon(s),title:s.nome}).addTo(map).bindPopup(popup(s));
    m.on('click',function(){mark(s.id);});
    markers[s.id]=m; grp.push([s.lat,s.lng]);
  });
  document.getElementById('count').textContent=vis.length+' de '+STANDS.length+' stands'+(semPos?' ('+semPos+' localizando no mapa…)':'');
  document.getElementById('list').innerHTML=vis.map(function(s){
    return '<div class="item" data-id="'+s.id+'" id="it'+s.id+'"><span class="dot" style="background:'+cor(s.dev)+'"></span><div><b>'+esc(s.dev)+' · '+esc(s.nome)+'</b><span>'+esc(s.end)+' — '+esc(s.bairro)+'</span></div></div>';}).join('')
    || '<div style="padding:16px;color:#5f6f80;font-size:13px">Nenhum stand encontrado. Limpe os filtros ou a busca.</div>';
  if(fit&&grp.length) map.fitBounds(grp,{padding:[50,50],maxZoom:14});
}
function mark(id){
  document.querySelectorAll('.item.sel').forEach(function(e){e.classList.remove('sel');});
  var e=document.getElementById('it'+id); if(e){e.classList.add('sel');e.scrollIntoView({block:'nearest'});}
}
document.getElementById('devChips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;selDev=b.dataset.d||null;render(true);});
document.getElementById('zoneChips').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;selZone=b.dataset.z||null;render(true);});
document.getElementById('q').addEventListener('input',function(e){texto=e.target.value.trim().toLowerCase();render(true);});
document.getElementById('list').addEventListener('click',function(e){
  var it=e.target.closest('.item'); if(!it)return; var id=+it.dataset.id, s=STANDS[id]; if(s.lat==null)return;
  document.getElementById('side').classList.remove('open'); document.getElementById('toggle').textContent='Ver lista';
  map.setView([s.lat,s.lng],16); setTimeout(function(){markers[id]&&markers[id].openPopup();},250); mark(id);
});
document.getElementById('toggle').addEventListener('click',function(){
  var a=document.getElementById('side'); a.classList.toggle('open'); this.textContent=a.classList.contains('open')?'Ver mapa':'Ver lista';
});

// ---- Refinamento das posições pelo navegador (Nominatim/OpenStreetMap), com cache ----
function dist(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r*Math.cos(a*r);return R*Math.sqrt(x*x+y*y);}
function norm(e){return e.replace(/\s+/g,' ').replace(/ – .*/,'').replace(/^(R\.|Rua) /,'Rua ').replace(/^Av\.? /,'Avenida ');}
function geocodar(fila){
  if(!fila.length){finalizar();return;}
  var s=fila.shift();
  var url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&q='+encodeURIComponent(norm(s.end)+', '+s.bairro+', São Paulo');
  fetch(url,{headers:{'Accept':'application/json'}}).then(function(r){return r.json();}).then(function(j){
    if(j&&j[0]){
      var la=+j[0].lat, ln=+j[0].lon;
      var ok=(s.lat==null)?(la>-24.1&&la<-23.2&&ln>-47&&ln<-46.2):dist(s.lat,s.lng,la,ln)<5;
      if(ok){ s.lat=la;s.lng=ln;s.exato=true;cache[chave(s)]=[la,ln]; try{localStorage.setItem('smq_stands_geo',JSON.stringify(cache));}catch(e){} render(false);}
    }
  }).catch(function(){}).then(function(){setTimeout(function(){geocodar(fila);},1100);});
}
function finalizar(){
  if(/[?&]refinar=1/.test(location.search)){
    var o=STANDS.map(function(s){return {id:s.id,dev:s.dev,nome:s.nome,lat:+s.lat.toFixed(6),lng:+s.lng.toFixed(6),exato:!!s.exato};});
    document.getElementById('dumpTxt').value=JSON.stringify(o); document.getElementById('dump').style.display='block';
  }
}
function pend(){return STANDS.filter(function(s){return !s.exato&&!s.fixed;}).slice();}
function carregarPlanilha(){
  var cb='smqStands'+Date.now(), sc=document.createElement('script'), feito=false;
  window[cb]=function(r){feito=true;try{
    var rows=r.table.rows, out=[];
    rows.forEach(function(row){
      var c=function(i){var x=row.c[i];return x&&x.v!=null?String(x.v).trim():'';};
      if(!c(0)||!c(2)) return;
      if(/^n[aã]o$/i.test(c(8))) return;
      var lat=parseFloat(c(5).replace(',','.')), lng=parseFloat(c(6).replace(',','.'));
      var s={id:out.length,dev:c(0),nome:c(1)||c(3),end:c(2),bairro:c(3),zona:c(4)||'Outras',lat:null,lng:null,foto:c(7),obs:c(9)};
      if(!isNaN(lat)&&!isNaN(lng)){s.lat=lat;s.lng=lng;s.exato=true;s.fixed=true;}
      else{var b=BASE.filter(function(x){return x.end===s.end;})[0]; if(b){s.lat=b.lat;s.lng=b.lng;}}
      out.push(s);
    });
    if(out.length){STANDS=out;aplicaCache();render(true);}
  }catch(e){} geocodar(pend());};
  sc.onerror=function(){if(!feito)geocodar(pend());};
  sc.src='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json;responseHandler:'+cb;
  document.head.appendChild(sc);
}
render(true);
carregarPlanilha();
</script>
