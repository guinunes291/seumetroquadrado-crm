project_id = "rldnprwjlomjmjvinxuh"

# O CRM e somente por convite. Replicar esta configuracao no projeto Supabase
# vivo durante o rollout; a migration tambem mantém contas nao convidadas
# pendentes e sem papel como segunda camada de defesa.
[auth]
enable_signup = false

# Webhook público do Zapier (Facebook Lead Ads). Autenticação via LEAD_INTAKE_SECRET,
# não por JWT do Supabase.
[functions.lead-intake]
verify_jwt = false

# Fase 2 Sami — chamada server-to-server do n8n. Autenticação via header x-sami-key
# (secret SAMI_WRITE_KEY), não por JWT do Supabase.
[functions.sami-agendar-visita]
verify_jwt = false

# Fase 3 Sami — recebe documento por WhatsApp e anexa ao lead. Autenticação via
# header x-sami-key (secret SAMI_WRITE_KEY), não por JWT do Supabase.
[functions.sami-anexar-documento]
verify_jwt = false

[functions.sami-consultar-agenda]
verify_jwt = false

[functions.crm-convites]
verify_jwt = true

# Telefonia Sonax — click-to-call chamado do app com o JWT do corretor (RLS
# decide o que ele pode discar/registrar).
[functions.sonax-discar]
verify_jwt = true

# Telefonia Sonax — discador automático por campanha (enfileirar leads,
# play/stop), chamado do app com o JWT do corretor.
[functions.sonax-campanha]
verify_jwt = true

# Telefonia Sonax — sincroniza tabulações do discador com o funil, chamado
# do app com o JWT do corretor.
[functions.sonax-tabulacoes]
verify_jwt = true

# Telefonia Sonax — URL de integração do PABX (template estático, sem headers).
# Autenticação via SONAX_WEBHOOK_SECRET (?secret= ou x-webhook-secret), não por
# JWT do Supabase.
[functions.sonax-webhook]
verify_jwt = false
